name: Deploy dev
on:
  push:
    branches: [develop]
env: 
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{secrets.AWS_ECR_REGISTRY}}

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      
      - name: Configure Aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}} 
          aws-region: ${{env.AWS_REGION}}
      
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build & push Backend
        #github.sha를 사용한 이유는 푸쉬 후에 이미지 태그를 변경하기 위해
        run: |
          docker build -t $ECR_REGISTRY/backend:${{github.sha}} app/backend/ 
          docker push $ECR_REGISTRY/backend:${{github.sha}}
      
      - name: Update values-dev.yaml
        run: |
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|" helm/backend/values-dev.yaml
      - name: Git push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add helm/backend/values-dev.yaml
          git commit -m "chore: update backend-dev image tag to ${{ github.sha }}"
          git push
  build-and-deploy-frontend:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Login to ECR
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build & Push Frontend
          run: |
            docker build -t $ECR_REGISTRY/frontend:${{ github.sha }} app/frontend/
            docker push $ECR_REGISTRY/frontend:${{ github.sha }}

        - name: Update values-dev.yaml
          run: |
            sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|" helm/frontend/values-dev.yaml

        - name: Git Push
          run: |
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add helm/frontend/values-dev.yaml
            git commit -m "chore: update frontend-dev image tag to ${{ github.sha }}"
            git push
      